<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Κάθοδος</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Commissioner:wght@400;500;600;700&family=Fira+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. A tall underworld "world" scrolls behind a fixed HUD; the soul sinks
   from the Taenaron cave mouth through six strata to Elysium. 1 point = 10 metres, 700 points = 7,000 m.
   Single committed dark look (night underworld), so no light theme. */
:root {
  --void: #0b1013;          /* page ground */
  --panel: rgba(12, 20, 24, .86);
  --panel-line: rgba(201, 164, 92, .35);
  --mist: #e4e6da;          /* main text, asphodel pale */
  --mute: #9aa8a2;
  --obol: #d2ad62;          /* bronze coin, accent */
  --obol-deep: #8a6c34;
  --ember: #e0603f;         /* timer low, Lethe */
  --soul: #bfe9ff;
  --t1: #6fa8b4; --t2: #7f97c4; --t3: #8d7fc9; --t4: #c46a6a; --t5: #cfd3a8; --t6: #f1cf7a;  /* tier colours */
  --display: "GFS Didot", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Commissioner", "Segoe UI", system-ui, sans-serif;
  --mono: "Fira Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--mist); font-family: var(--body); font-size: 16px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--obol); outline-offset: 2px; }

/* ---------- world ---------- */
#viewport { position: fixed; inset: 0; overflow: hidden; }
#world { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
#strata { position: absolute; inset: 0; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sky { position: absolute; left: 0; right: 0; }
.landmark { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); font: 400 .68rem/1.3 var(--mono); color: rgba(228,230,218,.28);
  letter-spacing: .04em; white-space: nowrap; transform: translateY(-50%); }
.landmark b { font-weight: 500; color: rgba(210,173,98,.7); }
.landmark.zone { font: 400 .78rem var(--mono); letter-spacing: .32em; color: rgba(228,230,218,.4); text-transform: uppercase; }
.ruler { position: absolute; top: 0; bottom: 0; right: max(10px, env(safe-area-inset-right, 0px)); width: 40px; border-right: 1px solid rgba(228,230,218,.08); }
.tick { position: absolute; right: 0; width: 8px; border-top: 1px solid rgba(228,230,218,.25); }
.tick span { position: absolute; right: 12px; top: -.6em; font: .6rem var(--mono); color: rgba(228,230,218,.25); white-space: nowrap; }
.deco { position: absolute; pointer-events: none; }
.tierline { position: absolute; left: 12%; right: 12%; border-top: 1px dashed rgba(228,230,218,.28); transition: opacity .4s; }
.tierline span { position: absolute; right: 0; top: -1.5em; font: .7rem var(--mono); letter-spacing: .08em; color: rgba(228,230,218,.6); }
.tierline.hit { border-top-style: solid; border-top-color: var(--c); }
.tierline.hit span { color: var(--c); }
#soul { position: absolute; left: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
  background: radial-gradient(circle at 40% 38%, #fff 0 18%, var(--soul) 38%, rgba(191,233,255,.25) 62%, transparent 72%);
  filter: drop-shadow(0 0 12px rgba(191,233,255,.85)); }
#soul::after { content: ""; position: absolute; left: 8px; width: 10px; bottom: 18px; height: 34px; border-radius: 6px;
  background: linear-gradient(to top, rgba(191,233,255,.45), transparent); }
@media (prefers-reduced-motion: no-preference) { #soul { animation: bob 3.2s ease-in-out infinite; } }
@keyframes bob { 50% { translate: 0 -5px; } }

/* ---------- HUD ---------- */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.gaugebox { justify-self: start; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 8px; padding: 5px 12px 6px; min-width: 92px; }
.gaugebox.r { justify-self: end; text-align: right; }
.gaugebox small { display: block; font: .6rem var(--mono); letter-spacing: .18em; color: var(--mute); }
.gaugebox strong { font: 500 1.25rem var(--mono); font-variant-numeric: tabular-nums; color: var(--soul); }
.gaugebox.r strong { color: var(--obol); }
.pips { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pips .row { display: flex; gap: 5px; }
.pip { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(228,230,218,.35); background: rgba(0,0,0,.4); }
.pip.now { border-color: var(--obol); box-shadow: 0 0 0 2px rgba(210,173,98,.25); }
.pip.miss { background: transparent; border-style: dashed; border-color: var(--ember); }
.pips small { font: .6rem var(--mono); letter-spacing: .14em; color: var(--mute); }

/* ---------- panels ---------- */
.layer { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 84px) calc(env(safe-area-inset-bottom, 0px) + 18px); }
.layer > * { pointer-events: auto; }
.card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 16px 20px 14px;
  backdrop-filter: blur(3px); }
.card .meta { display: flex; justify-content: space-between; gap: 12px; font: .68rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--obol); }
.card .meta span:last-child { color: var(--mute); }
.prompt { font: 400 clamp(1.35rem, 4.4vw, 1.9rem)/1.18 var(--display); margin: 8px 0 6px; text-wrap: balance; }
.hint { font: .7rem var(--mono); letter-spacing: .1em; color: var(--mute); }
.spacer { flex: 1; }
.dock { width: min(560px, 100%); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.fb { min-height: 1.3em; font: .82rem var(--mono); text-align: center; color: var(--obol); text-shadow: 0 1px 6px #000; }
.fb.bad { color: #ff9b85; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.chip { background: rgba(31,48,54,.95); border: 1px solid var(--panel-line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .92rem; }
.chip:hover { border-color: var(--obol); }
.entry { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 8px; }
.clock { position: relative; width: 46px; height: 46px; flex: none; }
.clock svg { width: 46px; height: 46px; transform: rotate(-90deg); }
.clock circle { fill: none; stroke-width: 3; }
.clock .bg { stroke: rgba(228,230,218,.15); }
.clock .fg { stroke: var(--soul); stroke-linecap: round; transition: stroke .3s; }
.clock.low .fg { stroke: var(--ember); }
.clock span { position: absolute; inset: 0; display: grid; place-items: center; font: 500 1rem var(--mono); font-variant-numeric: tabular-nums; }
.entry input { flex: 1; min-width: 0; background: rgba(0,0,0,.35); border: 1px solid rgba(228,230,218,.2); border-radius: 8px; color: var(--mist);
  padding: 11px 12px; font: 500 1.05rem var(--body); }
.entry input::placeholder { color: var(--mute); }
.btn { background: rgba(12,20,24,.75); color: var(--obol); border: 1px solid var(--obol); border-radius: 6px; padding: 11px 16px; font: 500 .82rem var(--mono); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--obol); color: #1d1608; }
.btn.ghost { background: transparent; color: var(--mist); border: 1px solid var(--panel-line); }
.btn.big { padding: 15px 30px; font-size: .9rem; min-width: min(360px, 100%); }
.countdown { text-align: center; font: .8rem var(--mono); letter-spacing: .12em; color: var(--mute); background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 999px; padding: 7px 16px; justify-self: center; }

/* verdict */
.verdict { margin-top: max(26vh, 150px); width: min(480px, 100%); text-align: center; display: grid; gap: 8px; justify-items: center; }
#otherbox { width: 100%; }
.verdict .tier { font: 500 clamp(1.6rem, 6vw, 2.3rem)/1 var(--mono); letter-spacing: .22em; color: var(--c); text-shadow: 0 0 18px rgba(0,0,0,.9); }
.verdict .ans { font-size: 1.15rem; font-weight: 600; }
.verdict .pts { font: 500 .95rem var(--mono); color: var(--c); }
.verdict .flav { font-size: .9rem; color: var(--mute); max-width: 36ch; }
.others { width: 100%; margin-top: 8px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 10px 14px; text-align: left; font-size: .88rem; }
.others h3 { margin: 0 0 4px; font: .64rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.others ol { margin: 0 0 6px; padding-left: 1.3em; } .others li { margin: 1px 0; }
.others .pct { color: var(--mute); font: .78rem var(--mono); }
.others .me { color: var(--obol); }

/* start + end */
.title { margin-top: 4vh; text-align: center; display: grid; gap: 10px; justify-items: center; }
.title h1 { margin: 0; font: 400 clamp(3rem, 14vw, 5.6rem)/.95 var(--display); letter-spacing: .06em; color: var(--mist); text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.title .tag { font: .8rem var(--mono); letter-spacing: .32em; text-transform: uppercase; color: var(--obol); }
.rule { font: .74rem var(--mono); color: var(--mute); letter-spacing: .06em; }
.startbox { margin-top: auto; width: min(460px, 100%); display: grid; gap: 12px; justify-items: center; text-align: center; }
.startbox .row, .startbox .rules { width: 100%; text-align: left; }
.link { background: none; border: 0; padding: 0; font: .72rem var(--mono); letter-spacing: .12em; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.startbox .row { display: flex; justify-content: center; align-items: center; gap: 10px 22px; font: .72rem var(--mono); letter-spacing: .12em; color: var(--mute); flex-wrap: wrap; }
.startbox select { background: rgba(12,20,24,.9); color: var(--mist); border: 1px solid var(--panel-line); border-radius: 6px; padding: 5px 8px; font: .78rem var(--mono); }
.rules { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 10px 16px; font-size: .88rem; color: var(--mist); }
.rules ul { margin: 0; padding-left: 1.1em; display: grid; gap: 2px; }
.endwrap { width: min(620px, 100%); overflow-y: auto; max-height: 100%; display: grid; gap: 14px; padding-bottom: 8px; }
.endhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.endhead .score { font: 400 clamp(3rem, 12vw, 4.4rem)/1 var(--display); }
.endhead .score small { font: .9rem var(--mono); color: var(--mute); margin-left: 6px; }
.endhead .depth { font: 500 1rem var(--mono); color: var(--soul); }
.endcard { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 14px 16px; }
.endcard h3 { margin: 0 0 8px; font: .66rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.peer { font-size: .95rem; }
.peer strong { color: var(--obol); }
.log svg { width: 100%; height: auto; display: block; }
table.ans { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.ans td { padding: 6px 4px; border-top: 1px solid rgba(228,230,218,.1); vertical-align: top; }
table.ans td.n { color: var(--mute); font: .78rem var(--mono); width: 1.6em; }
table.ans td.r { text-align: right; font: .82rem var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.ans .q { display: block; color: var(--mute); font-size: .8rem; }
.share { white-space: pre-wrap; font: .9rem var(--mono); background: rgba(0,0,0,.35); border-radius: 8px; padding: 10px 12px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: .78rem; color: var(--mute); }
@media (max-width: 520px) {
  .landmark { font-size: .64rem; } .landmark.zone { font-size: .9rem; }
  .ruler { width: 34px; }
  .card { padding: 12px 14px; }
  .gaugebox { min-width: 74px; padding: 4px 9px; } .gaugebox strong { font-size: 1.05rem; }
  .pip { width: 10px; height: 10px; }
}
</style>

<div id="viewport" aria-hidden="true">
  <div id="world"><div id="strata"></div><div id="soul"></div></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="hud" id="hud" hidden>
  <div class="gaugebox"><small>ΒΑΘΟΣ</small><strong id="hDepth">0 μ</strong></div>
  <div class="pips"><div class="row" id="pips"></div><small id="hStep" hidden>ΕΡΩΤΗΣΗ 1 / 7</small></div>
  <div class="gaugebox r"><small>ΒΑΘΜΟΙ</small><strong id="hScore">0</strong></div>
</header>

<main class="layer" id="layer" lang="el" aria-live="polite"></main>

<script>
// Matching engine: JavaScript port of /home/user/normalize.py + the exact-spelling tier of bank/judge.py.
// Both sides (entity names/aliases and the player's input) are folded into the same Latin "match key".
const Engine = (() => {
  const ART = ["ο","η","το","οι","τα","τον","την","τη","του","της","των","τους","τις","ενας","ενα","μια","μιας","ενος",
    "o","i","h","to","oi","ta","ton","tin","th","tou","tis","ena","enas","mia","the"];
  const SNT = ["αγιος","αγια","αγιου","αγιας","αγιοι","αγιων","αγ","αη","αι","αγιο",
    "agios","agia","agiou","agias","agioi","ag","ai","ay","aghios","ayios","ayia"];
  const stripAcc = s => s.normalize("NFD").replace(/\p{Mn}/gu, "").normalize("NFC").replace(/ς/g, "σ");
  const ARTICLES = new Set(ART.map(stripAcc)), SAINT = new Set(SNT.map(stripAcc));

  function clean(raw) {
    let s = stripAcc(raw.trim().toLowerCase()).replace(/&/g, " και ");
    s = s.replace(/[«»"'’`´.,;:!?·()\[\]{}\/\\_\-–—]+/g, " ");
    let t = s.split(/\s+/).filter(Boolean);
    while (t.length > 1 && ARTICLES.has(t[0])) t = t.slice(1);
    return t.map(x => SAINT.has(x) ? "ag" : x);
  }

  const GR_DI = [["ου","u"],["αι","e"],["ει","i"],["οι","i"],["υι","i"],["αυ","av"],["ευ","ev"],["ηυ","iv"],
    ["μπ","b"],["ντ","d"],["γκ","g"],["γγ","g"],["γχ","gh"],["τσ","ts"],["τζ","tz"]];
  const GR_SG = {}; "αβγδεζηθικλμνξοπρστυφχψω".split("").forEach((c, i) =>
    GR_SG[c] = ["a","v","g","d","e","z","i","th","i","k","l","m","n","ks","o","p","r","s","t","i","f","h","ps","o"][i]);
  function greekKey(t) { for (const [a, b] of GR_DI) t = t.split(a).join(b); return [...t].map(c => GR_SG[c] ?? c).join(""); }

  const GL = {"nth":["nth","nti"],"th":["th","ti"],"8":["th"],"ch":["h"],"ps":["ps"],"ks":["ks"],"dh":["d"],"gh":["g"],
    "ou":["u"],"oy":["u"],"ai":["e","ai"],"ei":["i"],"oi":["i"],"au":["av"],"eu":["ev"],
    "mp":["b"],"nt":["d"],"gk":["g"],"gg":["g"],"ng":["g","ng"],"tz":["tz"],"ts":["ts"],"dz":["tz"],"j":["tz"],
    "3":["ks"],"4":["d"],"w":["o"],"c":["k"],"q":["k"],
    "h":["i","h"],"x":["h","ks"],"u":["u","i"],"y":["i","g"],"b":["b","v"],"f":["f","v"]};
  const GL_MAX = 3, MAXV = 64;
  function product(slots, cap) {
    let out = [""];
    for (const s of slots) { const n = []; for (const p of out) for (const x of s) n.push(p + x); out = n; if (out.length > cap * 4) break; }
    return out;
  }
  function greeklishKeys(t) {
    const slots = []; let i = 0;
    while (i < t.length) {
      let hit = false;
      for (let n = GL_MAX; n > 0; n--) { const ch = t.slice(i, i + n); if (GL[ch]) { slots.push(GL[ch]); i += n; hit = true; break; } }
      if (!hit) { slots.push([t[i]]); i++; }
    }
    const total = slots.reduce((a, s) => a * s.length, 1);
    if (total > MAXV) return new Set([slots.map(s => s[0]).join("")]);
    return new Set(product(slots, MAXV));
  }
  const squash = k => k.replace(/([a-z])\1+/g, "$1");
  const isLatin = t => /[a-z]/.test(t) && !/[α-ω]/.test(t);
  function perms(a) { if (a.length <= 1) return [a]; const r = []; a.forEach((x, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).forEach(p => r.push([x, ...p]))); return r; }

  function keys(raw) {
    const toks = clean(raw);
    const per = toks.map(t => t === "ag" ? new Set(["ag"]) : isLatin(t) ? greeklishKeys(t) : new Set([greekKey(t)]));
    const permute = toks.length > 1 && toks.length <= 3 && toks.every(t => t.length >= 3);
    const orders = permute ? perms(per) : [per];
    const out = new Set();
    for (const ord of orders) {
      let combos = [""];
      for (const s of ord) { const n = []; for (const p of combos) for (const x of s) { n.push(p + x); if (n.length >= MAXV) break; } combos = n.slice(0, MAXV); }
      combos.forEach(c => out.add(squash(c)));
    }
    return out;
  }
  const stem = k => k.length > 4 ? k.replace(/(ia|ies|ion|ides|des|os|as|is|es|us|on|un|i|a|o|e|u|s|n)$/, "") : k;
  const spelled = s => clean(s).join(" ");

  function damerau(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 0; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
      const c = a[i - 1] !== b[j - 1] ? 1 : 0;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[a.length][b.length];
  }

  // Index over one universe: names[i] canonical, aliases[i] array.
  function buildIndex(names, aliases) {
    const acc = new Map(), exact = new Map(), keyed = new Map(), stems = new Map(), last = new Map(), first = new Map();
    const add = (m, k, i) => { let s = m.get(k); if (!s) m.set(k, s = new Set()); s.add(i); };
    names.forEach((n, i) => {
      for (const f of [n, ...(aliases[i] || [])]) {
        add(acc, f.trim().toLowerCase(), i); add(exact, spelled(f), i);
        for (const k of keys(f)) { add(keyed, k, i); add(stems, stem(k), i); }
      }
      const t = clean(n);
      if (t.length > 1 && t[t.length - 1] !== "ag") for (const k of keys(t[t.length - 1])) add(last, squash(k), i);
      // "Αλκαίος ο Μυτιληναίος", "Διοσκουρίδης ο Πεδάνιος": the first word alone is how players say it.
      if (t.length > 2 && (t[1] === "ο" || t[1] === "η") && t[0].length >= 4) for (const k of keys(t[0])) add(first, squash(k), i);
    });
    return { names, acc, exact, keyed, stems, last, first };
  }

  // -> {status: "match", i} | {status: "suggest", cands: [i...]} | {status: "unknown"}
  function match(ix, raw) {
    if (!raw.trim()) return { status: "unknown" };
    // Typed with the exact accents of one entry (άρα vs αρά): that entry, no question asked.
    const ac = ix.acc.get(raw.trim().toLowerCase());
    if (ac && ac.size === 1) return { status: "match", i: [...ac][0] };
    const ex = ix.exact.get(spelled(raw));
    if (ex && ex.size === 1) return { status: "match", i: [...ex][0] };
    // "αλεπού" is the name of the genus and an alias of the red fox: the entry whose own name was typed wins.
    if (ex && ex.size > 1) { const own = [...ex].filter(i => spelled(ix.names[i]) === spelled(raw)); if (own.length === 1) return { status: "match", i: own[0] }; }
    const ks = keys(raw);
    const union = m => { const s = new Set(); for (const k of ks) for (const i of (m.get(typeof m === "function" ? k : k) || [])) s.add(i); return s; };
    let hits = union(ix.keyed);
    if (hits.size === 1) return { status: "match", i: [...hits][0] };
    if (hits.size > 1) return { status: "suggest", cands: [...hits].slice(0, 4) };
    hits = new Set(); for (const k of ks) for (const i of (ix.stems.get(stem(k)) || [])) hits.add(i);
    if (hits.size === 1) return { status: "match", i: [...hits][0] };

    const rank = i => { const b = boost.indexOf(U.n[i]); return b >= 0 ? b : 1e6 - U.p[i]; };
    const idx = [...p.v].sort((a, b) => rank(a) - rank(b));
    // short lists concentrate harder: everyone names the same few emperors, almost nobody says Nerva
    const z = ZIPF + 0.6 * Math.min(1, Math.max(0, (40 - idx.length) / 27));
    let H = 0; idx.forEach((_, r) => H += Math.pow(r + 1, -z));
    const m = new Map(); idx.forEach((i, r) => m.set(U.n[i], Math.pow(r + 1, -z) / H));
    return (priorCache[pid] = m);
  }
  function shares(pid) {
    const prior = priorShares(pid), c = crowd[pid] || { counts: {}, total: 0 }, m = new Map();
    for (const [name, ps] of prior) m.set(name, ((c.counts[name] || 0) + PRIOR_WEIGHT * ps) / (c.total + PRIOR_WEIGHT));
    return { m, total: c.total, counts: c.counts };
  }
  const tierOf = s => TIERS.findIndex(t => s >= t.min);
  function scoreOf(ds) { let pts = 0; for (const pid of ids()) { const a = ds[pid]; if (a && a.e) pts += a.pts; } return pts; }

  // ---------- world drawing ----------
  const world = $("world"), strata = $("strata"), soul = $("soul");
  const yOf = m => SKY + m * PX_PER_M;
  const WORLD_H = yOf(MAX_M) + 900;
  function buildWorld() {
    world.style.height = WORLD_H + "px";
    const stops = [`#2b2140 0px`, `#7a4a3a ${SKY * 0.62}px`, `#c48a52 ${SKY - 30}px`, `#1c3a41 ${SKY + 40}px`];
    ZONES.forEach((z, i) => { const y = yOf(z.at); stops.push(`${z.col} ${y + (i ? 120 : 40)}px`); });
    stops.push(`#c9a45c ${yOf(MAX_M) + 80}px`, `#f6e3a8 ${WORLD_H}px`);
    strata.style.background = `linear-gradient(to bottom, ${stops.join(",")})`;
    let h = "";
    // cave mouth at Taenaron: rock silhouette with a dark opening at the surface line
    h += `<svg class="deco" style="left:0;top:${SKY - 150}px;width:100%;height:210px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)" viewBox="0 0 1000 210" preserveAspectRatio="none">
      <path d="M0 210 L0 120 L90 96 L170 118 L260 70 L330 92 L380 60 L420 150 L580 150 L620 64 L690 88 L760 50 L850 100 L920 84 L1000 110 L1000 210 Z" fill="#0d1416"/>
      <path d="M420 150 Q500 60 580 150 Z" fill="#05090a"/></svg>`;
    // Charon's boat on the river
    h += `<svg class="deco" style="left:58%;top:${yOf(880) - 40}px;width:150px;height:70px" viewBox="0 0 150 70">
      <path d="M8 44 Q75 64 142 40 L132 52 Q75 70 18 54 Z" fill="#0a1214"/><path d="M70 44 L76 6 L80 6 L76 44 Z" fill="#0a1214"/>
      <circle cx="62" cy="30" r="6" fill="#0a1214"/><path d="M54 44 L58 34 L68 34 L70 44 Z" fill="#0a1214"/>
      <path d="M100 6 L84 60" stroke="#0a1214" stroke-width="3"/><circle cx="104" cy="32" r="2.5" fill="#d2ad62"/></svg>`;
    // Cerberus: three heads
    h += `<svg class="deco" style="left:60%;top:${yOf(2700) - 60}px;width:170px;height:110px" viewBox="0 0 170 110">
      <path d="M30 100 L36 64 Q60 48 100 52 Q130 54 140 70 L146 100 L132 100 L128 82 L56 82 L50 100 Z" fill="#120b14"/>
      <path d="M40 66 L22 30 L44 22 L56 50 Z M74 54 L70 14 L94 12 L92 50 Z M106 54 L122 22 L142 30 L124 62 Z" fill="#120b14"/>
      <circle cx="34" cy="30" r="2" fill="#e0603f"/><circle cx="82" cy="18" r="2" fill="#e0603f"/><circle cx="130" cy="30" r="2" fill="#e0603f"/>
      <path d="M146 76 Q166 60 158 40" stroke="#120b14" stroke-width="5" fill="none"/></svg>`;
    // asphodel stalks
    for (let k = 0; k < 5; k++) {
      const x = 6 + k * 19 + (k % 2) * 4, y = yOf(4300 + (k % 3) * 140);
      h += `<svg class="deco" style="left:${x}%;top:${y - 70}px;width:26px;height:80px" viewBox="0 0 26 80"><path d="M13 80 L13 18" stroke="#3d4a3a" stroke-width="2"/>
        ${[16, 26, 36, 46].map((yy, j) => `<circle cx="${j % 2 ? 18 : 8}" cy="${yy}" r="3.4" fill="#dfe3c6" opacity=".55"/>`).join("")}</svg>`;
    }
    // Sisyphus' hill and boulder
    h += `<svg class="deco" style="left:54%;top:${yOf(5500) - 70}px;width:200px;height:100px" viewBox="0 0 200 100">
      <path d="M0 100 L170 22 L200 30 L200 100 Z" fill="#1a0b0b"/><circle cx="118" cy="34" r="17" fill="#2b1512"/>
      <path d="M96 66 L104 50 L98 40" stroke="#1a0b0b" stroke-width="5" fill="none"/></svg>`;
    // Elysium: columns and a laurel line
    h += `<svg class="deco" style="left:0;top:${yOf(MAX_M) - 30}px;width:100%;height:150px" viewBox="0 0 1000 150" preserveAspectRatio="none">
      <path d="M0 150 L0 110 Q250 80 500 104 Q750 128 1000 96 L1000 150 Z" fill="#8a6c34" opacity=".55"/>
      ${[120, 170, 220, 780, 830, 880].map(x => `<rect x="${x}" y="30" width="16" height="84" fill="#f6e3a8" opacity=".35"/>`).join("")}
      <rect x="110" y="22" width="136" height="10" fill="#f6e3a8" opacity=".35"/><rect x="770" y="22" width="136" height="10" fill="#f6e3a8" opacity=".35"/></svg>`;
    ZONES.forEach(z => { if (z.at) h += `<div class="landmark zone" style="top:${yOf(z.at) + 60}px">${z.name}</div>`; });
    MARKS.forEach(([m, t]) => h += `<div class="landmark" style="top:${yOf(m) + (m === 0 ? 14 : 0)}px">── ${t}</div>`);
    h += `<div class="ruler" style="top:${SKY}px;height:${MAX_M * PX_PER_M}px">`;
    for (let m = 0; m <= MAX_M; m += 500) h += `<div class="tick" style="top:${m * PX_PER_M}px;${m % 1000 ? "width:4px" : ""}">${m % 1000 ? "" : `<span>${m / 1000}k</span>`}</div>`;
    h += `</div><div id="tierlines"></div>`;
    strata.innerHTML = h;
  }

  // camera + soul
  let soulM = -40, camY = 0, camFrac = .42;
  function place(m) {
    soulM = m;
    soul.style.top = yOf(m) + "px";
    const vh = innerHeight;
    camY = Math.max(0, Math.min(WORLD_H - vh, yOf(m) - vh * camFrac));
    world.style.transform = `translateY(${-camY}px)`;
  }
  function sinkTo(target, ms, frac = camFrac) {
    return new Promise(res => {
      if (reduce || ms <= 0) { camFrac = frac; place(target); return res(); }
      const from = soulM, f0 = camFrac, t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
        camFrac = f0 + (frac - f0) * e;
        place(from + (target - from) * e);
        k < 1 ? requestAnimationFrame(step) : res();
      };
      requestAnimationFrame(step);
    });
  }
  function showTierLines(base) {
    $("tierlines").innerHTML = TIERS.map((t, i) => `<div class="tierline" data-i="${i}" style="--c:${t.c};top:${yOf(base + t.pts * M_PER_PT)}px"><span>${CAPS(t.name)} · ${t.pts}</span></div>`).join("");
  }
  const clearTierLines = () => { const el = $("tierlines"); if (el) el.innerHTML = ""; };

  // ambient motes: mist near the top, embers in Tartarus, gold dust in Elysium
  const fx = $("fx"), ctx = fx.getContext("2d");
  const motes = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.8, v: .1 + Math.random() * .35, p: Math.random() * 6 }));
  function moteColor() {
    if (soulM > 6200) return "246,227,168"; if (soulM > 5100) return "224,96,63"; if (soulM > 3400) return "223,227,198"; return "191,233,255";
  }
  function drawFx(t) {
    const w = fx.width = innerWidth * devicePixelRatio, h = fx.height = innerHeight * devicePixelRatio;
    ctx.clearRect(0, 0, w, h);
    const col = moteColor(), up = soulM > 5100 && soulM < 6200;
    for (const d of motes) {
      d.y += (up ? -1 : 1) * d.v / 900; if (d.y > 1.05) d.y = -.05; if (d.y < -.05) d.y = 1.05;
      const a = .25 + .25 * Math.sin(t / 900 + d.p);
      ctx.fillStyle = `rgba(${col},${a})`; ctx.beginPath();
      ctx.arc((d.x + Math.sin(t / 3000 + d.p) * .01) * w, d.y * h, d.r * devicePixelRatio, 0, 7); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(drawFx);
  }

  // ---------- HUD ----------
  function hud() {
    const ds = dayState(day), list = ids();
    const depth = scoreOf(ds) * M_PER_PT;
    $("hDepth").textContent = fmtM(depth);
    $("hScore").textContent = scoreOf(ds);
    $("pips").innerHTML = list.map((pid, i) => {
      const a = ds[pid]; let cls = "pip", st = "";
      if (a && a.e) st = `style="background:${TIERS[a.tier].c};border-color:transparent"`;
      else if (a && a.miss) cls += " miss";
      else if (i === cur) cls += " now";
      return `<span class="${cls}" ${st}></span>`;
    }).join("");
    $("hStep").textContent = cur < list.length ? `ΕΡΩΤΗΣΗ ${cur + 1} / ${list.length}` : "ΤΕΛΟΣ";
  }

  // ---------- screens ----------
  const layer = $("layer");
  let cur = 0, timer = null;

          <li>Ίδιες 7 ερωτήσεις για όλους, κάθε μέρα.</li>
          <li>Γράψε μία σωστή απάντηση πριν αδειάσει η κλεψύδρα. Λάθος; Ξαναδοκίμασε όσο έχεις χρόνο.</li>
          <li>Όσο λιγότεροι τη σκεφτούν, τόσο πιο βαθιά πέφτεις: 1 βαθμός = 10 μέτρα.</li>
          <li>Η «έξυπνη» απάντηση; Την σκέφτηκαν κι άλλοι. 700 βαθμοί = Ηλύσια.</li>
          <li>Τόνοι, greeklish και αγγλικά ονόματα περνάνε.</li>
        </ul></div>
        <button class="btn big" id="go">${done ? "Δες τη σημερινή σου κάθοδο" : begun ? "▼ Συνέχισε την κατάβαση ▼" : "▼ Ξεκίνα την κατάβαση ▼"}</button>
        <div class="row"><span>ΜΕΡΑ ${day}${day === todayNum ? " · ΣΗΜΕΡΑ" : ""} · ${dateOf(day).toUpperCase()}</span>
          <button class="link" id="how" type="button">πώς παίζεται</button>
          <label>ΑΡΧΕΙΟ <select id="daySel">${DATA.days.map((_, i) => `<option value="${i + 1}" ${i + 1 === day ? "selected" : ""}>Μέρα ${i + 1}${i + 1 === todayNum ? " (σήμερα)" : ""}</option>`).join("")}</select></label></div>
      </div>`;
    $("go").onclick = () => { cur = firstOpen(); $("hud").hidden = false; if (cur >= ids().length) { place(scoreOf(dayState(day)) * M_PER_PT); screenEnd(); } else { place(scoreOf(dayState(day)) * M_PER_PT); screenPrompt(); } };
    $("daySel").onchange = e => { day = +e.target.value; recount(); screenStart(); };
    $("how").onclick = () => { $("rules").hidden = !$("rules").hidden; };
  }

  function screenPrompt() {
    clearTierLines(); hud();
    if (camFrac !== .42) sinkTo(soulM, 600, .42);
    const pid = ids()[cur], p = DATA.prompts[pid];
    layer.innerHTML = `<div class="card"><div class="meta"><span>${cur + 1} / 7 · ${CAT[p.c] || p.c}</span></div>
        <h2 class="prompt">${esc(p.el)}</h2></div>
      <div class="spacer"></div>
      <div class="dock" id="dock"><div class="countdown" id="cd">η κλεψύδρα γυρίζει σε ${COUNTDOWN}</div></div>`;
    let n = COUNTDOWN;
    const tick = setInterval(() => {
      n--; if (n > 0) { const cd = $("cd"); if (cd) cd.textContent = `η κλεψύδρα γυρίζει σε ${n}`; return; }
      clearInterval(tick); openEntry(pid);

    timer = { tick };
  }

  function openEntry(pid) {
    $("dock").innerHTML = `<div class="fb" id="fb"></div><div class="chips" id="chips"></div>
      <form class="entry" id="form" autocomplete="off">
        <div class="clock" id="clock"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="20"/><circle class="fg" id="arc" cx="23" cy="23" r="20" stroke-dasharray="125.7" stroke-dashoffset="0"/></svg><span id="secs">${SECONDS}</span></div>
        <input id="ans" type="text" placeholder="μία απάντηση…" aria-label="Απάντηση" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <button class="btn" type="submit">Βουτιά</button></form>`;
    const tried = [];
    const t0 = performance.now(), end = t0 + SECONDS * 1000;
    const run = () => {
      const left = Math.max(0, end - performance.now()), s = Math.ceil(left / 1000);
      const sec = $("secs"); if (!sec) return;
      sec.textContent = s; $("arc").style.strokeDashoffset = (125.7 * (1 - left / (SECONDS * 1000))).toFixed(1);
      $("clock").classList.toggle("low", s <= 5);
      if (left <= 0) { stopTimer(); miss(pid, tried); return; }

  }
  function stopTimer() { if (!timer) return; if (timer.tick) clearInterval(timer.tick); if (timer.raf) cancelAnimationFrame(timer.raf); timer = null; }

  function say(msg, bad) { const fb = $("fb"); if (fb) { fb.textContent = msg; fb.className = "fb" + (bad ? " bad" : ""); } }
  function attempt(pid, text, tried) {
    if (!text.trim()) return;
    const p = DATA.prompts[pid], { U, ix } = universe(p.u), r = Engine.match(ix, text), chips = $("chips");
    chips.innerHTML = "";
    if (r.status === "unknown") { say(`«${text.trim()}»: δεν αντηχεί στον Άδη. Δοκίμασε άλλη.`, true); return reset(); }
    if (r.status === "suggest") {
      say("Εννοείς…");
      chips.innerHTML = r.cands.map(i => `<button type="button" class="chip" data-i="${i}">${esc(U.n[i])}</button>`).join("");
      chips.querySelectorAll(".chip").forEach(b => b.onclick = () => { chips.innerHTML = ""; pick(pid, +b.dataset.i, tried); });
      return;
    }
    pick(pid, r.i, tried);
  }
  function reset() { const a = $("ans"); if (a) { a.select(); a.focus({ preventScroll: true }); } }
  function pick(pid, i, tried) {
    const p = DATA.prompts[pid], { U } = universe(p.u), name = U.n[i];
    if (!p.v.includes(i)) {
      if (!tried.includes(name)) tried.push(name);
      say(`«${name}» υπάρχει, αλλά δεν ταιριάζει εδώ.`, true); return reset();
    }
    stopTimer();
    const s = shares(pid).m.get(name) ?? 0, t = tierOf(s);

    saveLocal(); persist(); reveal(pid);
  }
  function miss(pid, tried) { dayState(day)[pid] = { miss: 1, tried }; saveLocal(); persist(); reveal(pid); }

  async function reveal(pid) {
    const a = dayState(day)[pid], base = soulM, ok = !!a.e, t = ok ? TIERS[a.tier] : LETHE;
    layer.innerHTML = ""; hud();
    if (!ok) await sinkTo(base, 500, .24);
    if (ok) {
      showTierLines(base);
      await sinkTo(base + a.pts * M_PER_PT, 900 + a.pts * 16, .24);
      document.querySelectorAll(".tierline").forEach(el => { if (+el.dataset.i === a.tier) el.classList.add("hit"); else el.style.opacity = .25; });
    }
    hud();
    const last = cur + 1 >= ids().length;
    layer.innerHTML = `<div class="verdict" style="--c:${t.c}">
        <div class="tier">${CAPS(t.name)}</div>
        <div class="ans">${ok ? `«${esc(a.e)}»` : "καμία σωστή απάντηση"}</div>${!ok && a.tried?.length ? `<div class="flav">δοκίμασες: ${a.tried.map(esc).join(", ")}</div>` : ""}
        <div class="pts">${ok ? `+${a.pts} βαθμοί · βυθίστηκες ${fmtM(a.pts * M_PER_PT)}` : "+0 βαθμοί"}</div>
        <div class="flav">${t.flav}</div>

      </div>`;
    $("next").onclick = () => { cur++; cur >= ids().length ? screenEnd() : screenPrompt(); };
    $("more").onclick = () => { $("otherbox").hidden = !$("otherbox").hidden; };

  }
  const pct = s => s >= 0.1 ? Math.round(s * 100) + "%" : s >= 0.01 ? (s * 100).toFixed(1).replace(".", ",") + "%" : "<1%";
  function others(pid, mine) {
    const { m, total } = shares(pid), sorted = [...m.entries()].sort((x, y) => y[1] - x[1]);
    const li = ([n, s]) => `<li class="${n === mine ? "me" : ""}">${esc(n)} <span class="pct">${pct(s)}</span></li>`;
    return `<div class="others"><h3>${total >= 5 ? `Τι είπαν ${total} παίκτες` : "Οι πιο συνηθισμένες (εκτίμηση)"}</h3><ol>${sorted.slice(0, 3).map(li).join("")}</ol>
      <h3>Βαθιές που υπήρχαν</h3><ol>${sorted.slice(-2).reverse().map(li).join("")}</ol>
      <span class="note">${DATA.prompts[pid].v.length} σωστές απαντήσεις συνολικά</span></div>`;
  }

  function screenEnd() {
    stopTimer(); clearTierLines(); hud();
    const ds = dayState(day), list = ids(), score = scoreOf(ds), depth = score * M_PER_PT;
    // peers: everyone who finished this day in the shared store
    const peerScores = [];
    for (const doc of playsSnap) {
      const d = doc.days && doc.days[day]; if (!d) continue;
      let sc = 0, n = 0;
      for (const pid of list) { const a = d[pid]; if (!a) continue; n++; if (a.e) { const sh = shares(pid).m.get(a.e) ?? 0; sc += TIERS[tierOf(sh)].pts; } }
      if (n === list.length) peerScores.push(sc);
    }
    let peer;
    if (peerScores.length >= 3) {
      const below = peerScores.filter(x => x < score).length;
      peer = `Πιο βαθιά από το <strong>${Math.round(100 * below / peerScores.length)}%</strong> των ${peerScores.length} παικτών αυτής της μέρας. Μέσος όρος: ${Math.round(peerScores.reduce((a, b) => a + b, 0) / peerScores.length)}.`;
    } else peer = `Μόλις παίξουν τουλάχιστον 3 άτομα την ίδια μέρα, εδώ θα δεις πώς τα πήγες σε σύγκριση μαζί τους.`;
    const glyphs = list.map(pid => { const a = ds[pid]; return a?.e ? TIERS[a.tier].glyph : LETHE.glyph; }).join("");
    const shareText = `Κάθοδος · Μέρα ${day}\n${glyphs}\n${score}/700 · ${fmtM(depth)}`;
    const rows = list.map((pid, i) => {
      const a = ds[pid] || {}, p = DATA.prompts[pid];
      const res = a.e ? `${esc(a.e)} <span class="q" style="color:${TIERS[a.tier].c}">${TIERS[a.tier].name}</span>` : `<span style="color:var(--ember)">Λήθη</span>`;
      return `<tr><td class="n">${i + 1}</td><td>${res}<span class="q">${esc(p.el)}</span></td><td class="r">+${a.pts || 0}</td></tr>`;
    }).join("");
    layer.innerHTML = `<div class="endwrap">
      <div class="endhead"><div class="score">${score}<small>/ 700</small></div><div class="depth">${fmtM(depth)} · ${zoneAt(depth)}</div></div>
      <div class="endcard peer">${peer}</div>
      <div class="endcard log"><h3>Ημερολόγιο κατάβασης</h3>${logChart(ds, list)}</div>
      <div class="endcard"><h3>Οι απαντήσεις σου</h3><table class="ans">${rows}</table></div>
      <div class="endcard"><h3>Μοιράσου το</h3><div class="share" id="shareText">${esc(shareText)}</div>
        <div class="btnrow" style="margin-top:10px"><button class="btn" id="copy">Αντιγραφή</button><span class="note" id="copied"></span></div></div>
      <div class="btnrow"><button class="btn ghost" id="home">Αρχική / άλλη μέρα</button><button class="btn ghost" id="again">Ξανά (δεν μετράει)</button></div>
    </div>`;
    $("copy").onclick = () => {
      const done = () => $("copied").textContent = "Αντιγράφηκε.";
      const sel = () => { const r = document.createRange(); r.selectNodeContents($("shareText")); getSelection().removeAllRanges(); getSelection().addRange(r); $("copied").textContent = "Επιλέχθηκε. Πάτα αντιγραφή."; };
      try { navigator.clipboard.writeText(shareText).then(done, sel); } catch (e) { sel(); }
    };
    $("home").onclick = screenStart;
    $("again").onclick = () => { state.counted[day] = true; delete state.days[day]; saveLocal(); cur = 0; place(-20); screenPrompt(); };
  }
  const zoneAt = m => { let z = ZONES[0].name; for (const x of ZONES) if (m >= x.at) z = x.name; return z; };
  function logChart(ds, list) {
    const W = 560, H = 230, L = 58, R = 10, T = 14, B = 26, max = 700;
    const x = i => L + (i + .5) * (W - L - R) / list.length, y = v => T + (H - T - B) * v / max;
    let h = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Βάθος μετά από κάθε ερώτηση">`;
    [0, 200, 400, 600, 700].forEach(v => h += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(228,230,218,.12)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#9aa8a2" font-family="Fira Mono, monospace">${fmtM(v * 10)}</text>`);
    let acc = 0, path = `M${x(-.5)} ${y(0)}`;
    list.forEach((pid, i) => {
      const a = ds[pid] || {}, from = acc; acc += a.pts || 0;
      const c = a.e ? `var(--t${a.tier + 1})` : "var(--ember)";
      path += ` L${x(i)} ${y(acc)}`;
      h += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(from)}" y2="${y(acc)}" stroke="${a.e ? c : "rgba(0,0,0,0)"}" stroke-width="6" stroke-linecap="round" opacity=".55"/>`;
      h += `<circle cx="${x(i)}" cy="${y(acc)}" r="5" fill="${c}"/><text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#9aa8a2" font-family="Fira Mono, monospace">${i + 1}</text>`;
    });
    h += `<path d="${path}" fill="none" stroke="rgba(191,233,255,.6)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>`;
    return h;
  }

  // ---------- shared answer counts (db) ----------
  let db = null, uid = null, canWrite = true, writeChain = Promise.resolve();
  // Only a day's first play counts. Once all 7 are answered the day is "counted"; replays are local only.
  let sent = {};  // what the shared store holds for this player, per day
  function persist() {
    if (state.counted[day]) return;
    const ds = dayState(day), out = {};
    for (const [pid, a] of Object.entries(ds)) if (a.e || a.miss) out[pid] = a.e ? { e: a.e } : { f: 1 };
    if (ids().every(pid => out[pid])) { state.counted[day] = true; saveLocal(); }
    if (!db || !uid || !canWrite) return;
    sent[day] = out;
    const body = { days: { ...sent } };
    writeChain = writeChain.then(() => db.doc("plays/" + uid).set(body)).catch(e => { if (e && (e.code === "invalid_argument" || e.code === "not_granted")) canWrite = false; });
  }
  function recount() {
    crowd = {}; players = 0;
    const set = new Set(ids());
    for (const doc of playsSnap) {
      const d = doc.days && doc.days[day]; if (!d) continue; let any = false;
      for (const [pid, a] of Object.entries(d)) {
        if (!set.has(pid) || !a.e) continue; any = true;
        const c = crowd[pid] ||= { counts: {}, total: 0 }; c.counts[a.e] = (c.counts[a.e] || 0) + 1; c.total++;
      }
      if (any) players++;
    }
  }
  (async () => {
    try {
      if (!window.claude?.use) return;
      const [dbx, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!dbx || !user) return;
      uid = await user.id(); if (!uid) return; db = dbx;
      const w = user.can ? await user.can("data.write") : null; if (w === false) canWrite = false;
      const mine = await db.doc("plays/" + uid).get().catch(() => null);
      if (mine && mine.exists) {
        const d = mine.data().days || {};
        for (const [dn, dd] of Object.entries(d)) {
          sent[dn] = dd; state.counted[dn] = true;
          for (const [pid, a] of Object.entries(dd)) if (!dayState(dn)[pid]) dayState(dn)[pid] = a.f ? { miss: 1, tried: [] } : { e: a.e, restore: true };
        }
      }
      db.collection("plays").onSnapshot(snap => {
        playsSnap = snap.docs.map(x => x.data() || {}); recount();
        for (const [dn, dd] of Object.entries(state.days)) for (const [pid, a] of Object.entries(dd)) if (a.restore && DATA.prompts[pid]) {
          const sh = shares(pid).m.get(a.e) ?? 0, t = tierOf(sh); Object.assign(a, { tier: t, pts: TIERS[t].pts, restore: false });
        }
        saveLocal(); if (!$("hud").hidden) hud();
      }, () => {});
    } catch (e) { /* plays offline */ }
  })();
  addEventListener("resize", () => place(soulM));
  buildWorld(); place(-12);
  requestAnimationFrame(drawFx);
  screenStart();
})();
</script>
</body></html>
